<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100vw;height:100vh;display:block}</style></head>
<body>
<iframe id="f" src="/index.html"></iframe>
<script>
const q = new URLSearchParams(location.search);
const y = Number(q.get('y') || 0);
const test = q.get('test');
const f = document.getElementById('f');
f.addEventListener('load', () => {
  const w = f.contentWindow, d = f.contentDocument;
  setTimeout(() => {
    if (test === 'booking') {
      d.querySelector('a[href="#reserve"]').click();
      setTimeout(() => {
        const chip = d.querySelector('[data-guests="2"]'); chip && chip.click();
        const table = d.querySelector('.plan__table[data-table="T4"]'); table && table.click();
        setTimeout(() => {
          const next = d.querySelector('#nextBtn'); next && next.click();
          setTimeout(() => {
            d.querySelector('#guestName').value = 'Tushar';
            d.querySelector('#guestPhone').value = '9876543210';
            d.querySelector('#guestNote').value = 'Window seat, please';
            d.querySelector('#nextBtn').click();
            w.scrollTo(0, document.getElementById('f').contentWindow.document.getElementById('reserve').offsetTop);
            setTimeout(() => { document.title = 'BOOKED ' + (d.querySelector('.done__card')?.innerText || 'no'); }, 600);
          }, 400);
        }, 400);
      }, 500);
    } else {
      w.scrollTo(0, y);
    }
  }, 1200);
});
</script>
</body></html>
